# One command: `docker compose up --build`, then open http://localhost:8080 (shop) and http://localhost:8025 (sales inbox).
# Optional overrides go in a `.env` file next to this one (see .env.example).
name: product-catalogue

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FAKESTORE_BASE_URL: ${FAKESTORE_BASE_URL:-https://fakestoreapi.com}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-5000}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      CATEGORY_TOP_RATED_LIMIT: ${CATEGORY_TOP_RATED_LIMIT:-3}
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-Product Catalogue <no-reply@catalogue.local>}
      SALES_INBOX_EMAIL: ${SALES_INBOX_EMAIL:-sales@catalogue.local}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
    volumes:
      # Edit the curated "top rated" list without rebuilding (restart the api container to apply).
      - ./apps/api/config:/app/apps/api/config:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - mailpit
    restart: unless-stopped

  # Local stand-in for the sales inbox: catches every email the API sends. No account needed.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
      # SMTP, only needed when running the API outside Docker (`npm run dev`).
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    restart: unless-stopped
